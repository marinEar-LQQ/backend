<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>marinEar 엔진 검증</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 16px; max-width: 1100px; }
    button, select, input { font: inherit; margin: 2px; }
    fieldset { margin: 8px 0; }
    #log { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; border: 1px solid #8884; padding: 6px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    td, th { border: 1px solid #8884; padding: 4px; vertical-align: top; }
    .k-match { color: #1a7f37 } .k-difference { color: #cf222e; font-weight: 600 } .k-ambiguous { color: #9a6700; font-weight: 600 } .k-unrelated, .k-unknown { color: #6e7781 }
    .badge { font-size: 11px; padding: 1px 5px; border-radius: 4px; background: #8883; }
  </style>
</head>
<body>
  <h2>marinEar 엔진 검증 하네스 <span class="badge">백엔드 개발용 · 실제 화면 아님</span></h2>
  <fieldset>
    <legend>1. 엔진</legend>
    <label><input type="radio" name="mode" value="online" checked /> 온라인 (중계 서버 :8787)</label>
    <label><input type="radio" name="mode" value="model" /> 오프라인 모델 (Worker)</label>
    <label><input type="radio" name="mode" value="fixture" /> 시연 고정 데이터</label>
    <label><input type="checkbox" id="offline" /> 원격 모델 다운로드 금지 (오프라인 검증)</label>
    <label><input type="checkbox" id="skipTr" /> 번역 모델 건너뛰기</label>
    <select id="asrModel"><option value="">whisper-small (기본)</option><option value="onnx-community/whisper-base">whisper-base</option><option value="onnx-community/whisper-tiny">whisper-tiny</option></select>
    <select id="device"><option value="">장치 자동</option><option value="wasm">WASM (q8)</option><option value="webgpu">WebGPU</option></select>
    <button id="start">엔진 시작 + 자원 준비</button>
    <button id="ready">준비 상태</button>
    <div id="progress"></div>
  </fieldset>
  <fieldset>
    <legend>2. 작업 · 입력</legend>
    <button id="seed">시연 작업 등록 (독백 → 한라호/신선대부두 2번, 그 외 → 현대부산호/PNIT 2번)</button>
    <select id="sample">
      <option value="audio/team3/mono-a.wav">독백 1 입항 보고 (한라호)</option>
      <option value="audio/team3/mono-b.wav">독백 2 엔진 고장 (동방호)</option>
      <option value="audio/team3/mono-c.wav">독백 3 어선 연락 (해진호)</option>
      <option value="audio/demo/demo-script1.wav">시연 녹음1 (약한 잡음, HPNT·PNIT)</option>
      <option value="audio/demo/demo-script2.wav">시연 녹음2 (영어 섞임)</option>
      <option value="audio/team2/mono_noisy.wav">팀 녹음 mono (바람·세 시·라면)</option>
      <option value="audio/team/script1_noisy.wav">팀 대본1 (상선, 합성 잡음)</option>
      <option value="audio/team/script2_noisy.wav">팀 대본2 (영어 섞임)</option>
      <option value="audio/team/script3_noisy.wav">팀 대본3 (어선)</option>
      <option value="audio/scenario-radio.wav">scenario-radio.wav (TTS + 합성 잡음)</option>
      <option value="audio/scenario-clean.wav">scenario-clean.wav (TTS)</option>
      <option value="audio/radio-case-b.wav">radio-case-b.wav</option>
      <option value="audio/radio-case-a.wav">radio-case-a.wav</option>
    </select>
    <button id="runSample">샘플 분석</button>
    <input type="file" id="file" accept="audio/*" />
    <button id="mic">마이크 수신 시작</button>
    <button id="micStop">수신 중지</button>
  </fieldset>
  <fieldset>
    <legend>3. 결과</legend>
    <select id="lang"><option>en</option><option>id</option><option>vi</option><option>ko</option></select>
    <button id="perf">성능 요약</button>
    <button id="export">일지 TXT</button>
    <button id="exportJson">일지 JSON</button>
    <table><thead><tr><th>#</th><th>rev</th><th>판정</th><th>완화음 / 원음 인식</th><th>불확실</th><th>번역</th><th>재생</th></tr></thead><tbody id="rows"></tbody></table>
  </fieldset>
  <pre id="log"></pre>
  <script type="module" src="./main.ts"></script>
</body>
</html>
