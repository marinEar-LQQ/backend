# Render Blueprint — marinEar 중계 서버 (server/index.ts)
# Render 대시보드 > New > Blueprint > 이 레포 선택. 이 파일을 읽어 서비스를 만든다.
#
# 중계 서버는 음성을 Gemini·NVIDIA 로 넘기기만 해서 가볍다 → free 플랜으로 충분.
# 단, free 플랜은 15분 동안 요청이 없으면 잠들고 깨어나는 데 최대 1분 걸린다.
# 시연 직전에 https://<서비스>.onrender.com/api/health 를 한 번 열어 깨워 둘 것.
services:
  - type: web
    name: marinear-relay
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # 로컬 기본값은 127.0.0.1 (같은 PC 만). 배포 서버는 외부 요청을 받아야 한다.
      - key: HOST
        value: 0.0.0.0
      # 아래는 대시보드에서 직접 입력 (sync:false = git 에 안 올라감)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # 프론트 배포 주소 (예: https://marinear.vercel.app). 쉼표로 여러 개.
      - key: ALLOWED_ORIGINS
        sync: false
